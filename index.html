<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OttomanChess — Chess analysis assistant for macOS</title>
<meta name="description" content="OttomanChess: real-time chess analysis on lichess.org and chess.com. Overlay with best moves, local engines (Stockfish, Reckless, PlentyChess), annotated PGN export. Free, Apple-notarized, 100% local.">
<style>
  :root {
    --bg: #0f1419; --bg2: #171f28; --carte: #1c2632; --bord: #2a3644;
    --texte: #e8edf2; --doux: #9fb0c0; --accent: #34C759; --accent2: #0A84FF;
    --ombre-carte: 0 12px 40px rgba(0,0,0,.5);
    --ombre-cta: 0 10px 30px rgba(52,199,89,.35);
  }
  [data-theme="light"] {
    --bg: #f5f7fa; --bg2: #eceff3; --carte: #ffffff; --bord: #d8dfe7;
    --texte: #1c2632; --doux: #5a6b7d; --accent: #28a745; --accent2: #0066cc;
    --ombre-carte: 0 12px 40px rgba(0,0,0,.18);
    --ombre-cta: 0 10px 30px rgba(40,167,69,.30);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--texte); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; line-height: 1.6; transition: background .25s, color .25s; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 24px; }

  .toolbar { position: absolute; top: 18px; right: 24px; display: flex; gap: 8px; align-items: center; }
  .toolbar button { background: var(--carte); border: 1px solid var(--bord); color: var(--doux); font-size: .8rem; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: color .15s, border-color .15s; font-family: inherit; }
  .toolbar button:hover { color: var(--texte); }
  .toolbar button.actif { color: var(--texte); border-color: var(--accent2); }

  header { padding: 84px 0 48px; text-align: center; }
  header img { width: 110px; height: 110px; border-radius: 26px; box-shadow: var(--ombre-carte); }
  h1 { font-size: 2.6rem; margin: 20px 0 8px; letter-spacing: -0.5px; }
  .accroche { color: var(--doux); font-size: 1.15rem; max-width: 640px; margin: 0 auto 32px; }
  .badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
  .badge { background: var(--carte); border: 1px solid var(--bord); color: var(--doux); font-size: .8rem; padding: 5px 12px; border-radius: 999px; }
  .cta { display: inline-block; background: var(--accent); color: #06130a; font-weight: 700; font-size: 1.05rem; padding: 14px 34px; border-radius: 14px; text-decoration: none; transition: transform .15s, box-shadow .15s; }
  .cta:hover { transform: translateY(-2px); box-shadow: var(--ombre-cta); }
  .cta-secondaire { display: inline-block; margin-left: 12px; color: var(--accent2); text-decoration: none; font-weight: 600; padding: 14px 8px; }
  .compteur { color: var(--doux); font-size: .88rem; margin-top: 16px; display: none; }
  .compteur.visible { display: block; }

  section { padding: 40px 0; }
  h2 { font-size: 1.5rem; margin-bottom: 22px; }
  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 16px; padding: 22px; transition: background .25s, border-color .25s; }
  .carte h3 { font-size: 1.02rem; margin-bottom: 8px; }
  .carte p { color: var(--doux); font-size: .92rem; }
  .carte .icone { font-size: 1.5rem; margin-bottom: 10px; }

  .etapes { counter-reset: n; }
  .etape { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 16px; }
  .etape::before { counter-increment: n; content: counter(n); flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent2); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: .9rem; }
  .etape p { padding-top: 3px; }
  code { background: var(--carte); border: 1px solid var(--bord); border-radius: 6px; padding: 1px 7px; font-size: .88em; }

  footer { border-top: 1px solid var(--bord); margin-top: 40px; padding: 28px 0 48px; color: var(--doux); font-size: .85rem; text-align: center; }
  footer a { color: var(--accent2); text-decoration: none; }
  a { color: var(--accent2); }
</style>
</head>
<body>

<div class="toolbar">
  <button data-lang="en">EN</button>
  <button data-lang="fr">FR</button>
  <button data-lang="es">ES</button>
  <button data-lang="de">DE</button>
  <button id="theme-toggle" aria-label="Theme">☾</button>
</div>

<div class="wrap">

  <header>
    <img src="logo.jpg" alt="OttomanChess logo">
    <h1>OttomanChess</h1>
    <p class="accroche" data-i18n="accroche"></p>
    <div class="badges">
      <span class="badge">macOS 26.5+</span>
      <span class="badge">Apple silicon</span>
      <span class="badge" data-i18n="badge-notarie"></span>
      <span class="badge" data-i18n="badge-local"></span>
      <span class="badge" data-i18n="badge-maj"></span>
    </div>
    <a class="cta" href="https://github.com/Yil00/OttomanChess-releases/releases/latest" data-i18n="cta"></a>
    <a class="cta-secondaire" href="https://github.com/Yil00/OttomanChess-releases/releases" data-i18n="cta2"></a>
    <p class="compteur" id="compteur"></p>
  </header>

  <section>
    <h2 data-i18n="titre-features"></h2>
    <div class="grille">
      <div class="carte"><div class="icone">🎯</div><h3 data-i18n="f1t"></h3><p data-i18n="f1p"></p></div>
      <div class="carte"><div class="icone">🔍</div><h3 data-i18n="f2t"></h3><p data-i18n="f2p"></p></div>
      <div class="carte"><div class="icone">📄</div><h3 data-i18n="f3t"></h3><p data-i18n="f3p"></p></div>
      <div class="carte"><div class="icone">⚙️</div><h3 data-i18n="f4t"></h3><p data-i18n="f4p"></p></div>
      <div class="carte"><div class="icone">🔑</div><h3 data-i18n="f5t"></h3><p data-i18n="f5p"></p></div>
      <div class="carte"><div class="icone">🚫</div><h3 data-i18n="f6t"></h3><p data-i18n="f6p"></p></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="titre-install"></h2>
    <div class="etapes">
      <div class="etape"><p data-i18n-html="e1"></p></div>
      <div class="etape"><p data-i18n-html="e2"></p></div>
      <div class="etape"><p data-i18n-html="e3"></p></div>
    </div>
  </section>

  <footer>
    <p data-i18n="footer1"></p>
    <p style="margin-top:8px"><a href="https://github.com/Yil00/OttomanChess-releases" data-i18n="footer-depot"></a> ·
      <a href="https://github.com/Yil00/OttomanChess-releases/issues" data-i18n="footer-bug"></a> ·
      <a href="https://github.com/Yil00/OttomanChess-releases/releases" data-i18n="footer-histo"></a></p>
  </footer>

</div>

};

let langue = "en";
function t(k) { return (I18N[langue] && I18N[langue][k]) || I18N.en[k] || k; }

let totalTelechargements = null;

function appliquerLangue(l) {
  langue = I18N[l] ? l : "en";
  localStorage.setItem("oc-lang", langue);
  document.documentElement.lang = langue;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll(".toolbar [data-lang]").forEach(b => b.classList.toggle("actif", b.dataset.lang === langue));
  if (totalTelechargements !== null) afficherCompteur();
}

function afficherCompteur() {
  const el = document.getElementById("compteur");
  const txt = totalTelechargements === 1 ? t("dl-one") : t("dl-many").replace("{n}", totalTelechargements.toLocaleString(langue));
  el.textContent = "⬇ " + txt;
  el.classList.add("visible");
}

fetch("https://api.github.com/repos/Yil00/OttomanChess-releases/releases")
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(rels => {
    totalTelechargements = rels.reduce((s, r) => s + r.assets.reduce((a, x) => a + (x.download_count || 0), 0), 0);
    afficherCompteur();
  })
  .catch(() => {});

function appliquerTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("oc-theme", theme);
  document.getElementById("theme-toggle").textContent = theme === "light" ? "☀" : "☾";
}

document.querySelectorAll(".toolbar [data-lang]").forEach(b =>
  b.addEventListener("click", () => appliquerLangue(b.dataset.lang)));
document.getElementById("theme-toggle").addEventListener("click", () =>
  appliquerTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"));

appliquerTheme(localStorage.getItem("oc-theme") ||
  (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
appliquerLangue(localStorage.getItem("oc-lang") || "en");
</script>
</body>
</html>
